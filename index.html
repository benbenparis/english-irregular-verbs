<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verbes irréguliers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700&display=swap">
<style>
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}

/* Layout : fiche d'exercice type contrôle — réglages en haut, grille à compléter au centre, tableau de référence repliable en bas */
:root{
  --bg:#f7f4ec; --card:#ffffff; --fg:#1d2433; --muted:#6a7282; --line:#e3dfd3;
  --accent:#1f4e79; --accent-fg:#ffffff; --soft:#e4ecf5; --given:#f1eee4;
  --ok:#2e7d4f; --ok-soft:#e1f2e7; --bad:#b4423b; --bad-soft:#f8e4e2;
  --display:"Fraunces",Georgia,serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171a21; --card:#21262f; --fg:#eef0f4; --muted:#9aa3b2; --line:#343b47;
  --accent:#7fb2e6; --accent-fg:#101722; --soft:#283546; --given:#2a303b;
  --ok:#6fcf97; --ok-soft:#1f3a2c; --bad:#f08a82; --bad-soft:#42262a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171a21; --card:#21262f; --fg:#eef0f4; --muted:#9aa3b2; --line:#343b47;
  --accent:#7fb2e6; --accent-fg:#101722; --soft:#283546; --given:#2a303b;
  --ok:#6fcf97; --ok-soft:#1f3a2c; --bad:#f08a82; --bad-soft:#42262a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{width:100%;margin:0 auto;display:grid;gap:20px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,2.4em,56px);margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.top{display:flex;align-items:flex-start;gap:12px}
.top>div{flex:1 1 auto;min-width:0}
.iconbtn{flex:none;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);cursor:pointer;-webkit-tap-highlight-color:transparent}
.iconbtn:hover{background:var(--soft);color:var(--accent)}
.iconbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.hist li{border-left:3px solid var(--accent);padding:2px 0 2px 14px}
.hist .vh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.hist .vnum{font-family:var(--display);font-weight:800;font-size:1.15em}
.hist .vdate{color:var(--muted);font-size:.9em}
.hist .vtag{font-size:.75em;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:var(--soft);border-radius:6px;padding:1px 7px}
.hist ul{margin:6px 0 0;padding-left:18px;list-style:disc}
.hist li li{border:0;padding:1px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.label{text-transform:uppercase;letter-spacing:.08em;font-size:.75em;color:var(--muted);font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end}
.controls .btn.primary{flex:1 1 100%}
.ctl{display:grid;gap:4px}
.ctl label{font-weight:600;font-size:.95em}
input[type=number]{font:inherit;font-size:1.1em;width:5.5em;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.chk{display:flex;align-items:center;gap:8px;font-size:.95em;padding-bottom:8px}
.btn{font:inherit;font-weight:700;min-height:44px;padding:10px 18px;border-radius:10px;-webkit-tap-highlight-color:transparent;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,details summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:1em}
th{background:var(--accent);color:var(--accent-fg);text-align:left;padding:10px 12px;font-weight:700;white-space:nowrap}
td{padding:.4em;border-bottom:1px solid var(--line);vertical-align:top}
td.given{background:var(--given);font-weight:700}
td.given i{color:var(--muted);font-weight:400;font-size:.88em}
/* Grille d'exercice, version téléphone (par défaut) : une carte par ligne */
#grid,#grid tbody,#grid tr,#grid td{display:block;min-width:0;width:auto}
#grid thead{display:none}
#grid tr{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--card)}
#grid td{border:0;padding:8px 12px}
#grid td.num{display:none}
#grid tbody{counter-reset:ligne}
#grid tr::before{counter-increment:ligne;content:"Ligne " counter(ligne);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;padding:8px 12px 0}
#grid td::before{content:attr(data-label);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:3px}
#grid td.given{padding-block:8px 10px}
#grid td.given i{display:inline;margin-left:6px}
body.noipa td.given i,body.noipa .ipa-after{display:none!important}
.sel{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.sel .count{color:var(--muted);font-weight:400;font-size:.88em}
.selbtns{display:flex;gap:8px;margin:10px 0}
.btn.small{padding:6px 12px;min-height:40px;font-size:.9em}
.catgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.catchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 10px;font-weight:600;cursor:pointer;background:var(--bg)}
.catchip:has(input:checked){background:var(--soft);border-color:var(--accent)}
.verbgrid{display:grid;gap:10px}
.catdet{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.catdet[open]{background:var(--card)}
.cathead-sel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;list-style:none;font-weight:700}
.cathead-sel .catname{margin-right:auto}
.catdet .verbs{padding:4px 12px 12px}
.btn.tiny{padding:6px 10px;min-height:36px;font-size:.85em;font-weight:600}
.verbgrid .muted{color:var(--muted);margin:0}
.verbs{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.verbs label{display:flex;align-items:center;gap:8px;font-size:.95em;padding:8px 6px;min-height:40px;border-radius:6px;cursor:pointer}
.verbs label:hover{background:var(--soft)}
.verbs label i{color:var(--muted);font-size:.85em;font-style:normal}
.ref .cathead td{background:var(--given);font-weight:700;color:var(--fg)}
.say{font:inherit;font-size:.88em;line-height:1;border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:6px;padding:2px 6px;cursor:pointer;margin-left:6px;vertical-align:middle}
.say:hover{background:var(--soft)}
.say:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
td input{font:inherit;font-size:1.05em;width:100%;min-height:44px;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);scroll-margin-bottom:150px;scroll-margin-top:80px}
td input.ok{border-color:var(--ok);background:var(--ok-soft)}
td input.bad{border-color:var(--bad);background:var(--bad-soft)}
td input:disabled{opacity:.85;color:var(--bad);font-style:italic}
td .corr{font-size:.88em;color:var(--bad);padding:2px 4px 0;min-height:0}
td .ipa-after{color:var(--muted);font-style:normal;display:flex;align-items:center}
td .wrong{color:var(--bad);font-size:.88em;text-decoration:line-through;text-decoration-color:var(--bad);padding-bottom:2px}
#setup{display:grid;gap:20px}
.selerr{color:var(--bad);font-weight:700;padding-bottom:8px}
.colsel{flex:1 1 100%}
.hintsm{color:var(--muted);font-weight:400;font-size:.85em}
.colsel .catgrid{margin-top:0}
.selerr:empty{display:none}
.exohead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:14px}
.exoinfo{color:var(--muted);font-size:.95em}
.ipachk{flex:1 1 100%;padding-bottom:0;min-height:44px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;bottom:0;background:var(--card);padding:12px 0 0;margin-top:8px;border-top:1px solid var(--line)}
.row .btn{flex:1 1 auto;text-align:center}
.result{width:100%;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}
details>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";transition:transform .15s;flex:none}
details[open]>summary::before{transform:rotate(90deg)}
.ref{font-size:.95em;margin-top:12px}
.ref td{white-space:nowrap;min-width:0;padding:7px 10px}
.ref td i{color:var(--muted)}
.ref td:last-child{font-style:italic;white-space:normal}
.ref th{padding:8px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Écran large : tableau classique */
@media (min-width:760px){
  body{font-size:clamp(17px,.5vw + 11px,24px);padding-block:24px 48px}
  .card{padding:1.25em}
  .btn{min-height:0}
  .controls .btn.primary{flex:0 0 auto}
  .colsel{flex:1 1 320px;margin-left:8px}
  .ipachk{flex:0 0 auto;margin-left:auto;min-height:0}
  .verbs{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .verbs label{padding:4px 6px;min-height:0}
  .btn.tiny{padding:2px 8px;min-height:0}
  .btn.small{min-height:0}
  #grid{display:table;width:100%}#grid tbody{display:table-row-group}#grid thead{display:table-header-group}#grid tr{display:table-row;border:0;border-radius:0;margin:0;background:none}
  #grid td{display:table-cell;border-bottom:1px solid var(--line);padding:.4em;min-width:7em}
  #grid tr::before,#grid td::before{content:none}
  #grid td.num{display:table-cell;min-width:0;width:34px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;padding-top:14px}
  #grid td.given{padding:.6em .75em}
  #grid td.given i{display:block;margin:0}
  td input{font-size:1em;min-height:0;padding:.5em .65em}
  .row{position:static;background:none;padding:0;margin-top:16px;border:0}
  .row .btn{flex:0 0 auto}
  .result{width:auto;margin-left:auto;text-align:left}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="pagetitle">Verbes irréguliers</h1>
      <p class="sub" id="pagesub">Une case est donnée par ligne, complète les trois autres. Tab ou Entrée pour passer à la case suivante.</p>
    </div>
    <button class="iconbtn" id="histbtn" type="button" title="Historique des versions" aria-label="Historique des versions">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/>
        <path d="M3 4.5v4.5h4.5"/>
        <path d="M12 7.5V12l3.5 2"/>
      </svg>
    </button>
  </header>

  <div id="setup">
  <section class="card">
    <div class="controls">
      <div class="ctl">
        <label for="n">Nombre de lignes</label>
        <input type="number" id="n" inputmode="numeric" min="1" max="22" value="10">
      </div>
      <button class="btn primary" id="gen">Générer un tableau</button>
      <div class="ctl colsel">
        <label>Colonne donnée <span class="hintsm">(tirée au sort parmi celles cochées)</span></label>
        <div class="catgrid" id="colgrid"></div>
      </div>
      <span class="selerr" id="selerr"></span>
    </div>
    <details class="sel" id="seldetails">
      <summary>Choisir les catégories et les verbes <span class="count" id="selcount"></span></summary>
      <div class="label" style="margin-top:10px">Catégories</div>
      <div class="catgrid" id="catgrid"></div>
      <div class="label" style="margin-top:14px">Verbes</div>
      <div class="selbtns">
        <button class="btn small" id="selall">Tout cocher</button>
        <button class="btn small" id="selnone">Tout décocher</button>
      </div>
      <div class="verbgrid" id="verbgrid"></div>
    </details>
  </section>

  <section class="card">
    <details>
      <summary>Tableau de référence</summary>
      <div class="tablewrap ref"><table id="reftable">
        <thead><tr><th>Base verbale</th><th>Prétérit</th><th>Participe passé</th><th>Traduction</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </details>
  </section>
  </div>

  <section class="card" id="history" hidden>
    <div class="exohead">
      <button class="btn" id="histback">← Retour</button>
    </div>
    <ol class="hist" id="histlist"></ol>
  </section>

  <section class="card" id="exo" hidden>
    <div class="exohead">
      <button class="btn" id="back">← Retour</button>
      <span class="exoinfo" id="exoinfo"></span>
      <label class="chk ipachk"><input type="checkbox" id="noipa"> Masquer les prononciations</label>
    </div>
    <div class="tablewrap">
      <table id="grid">
        <thead><tr><th></th><th>Base verbale</th><th>Prétérit</th><th>Participe passé</th><th>Traduction</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="row">
      <button class="btn primary" id="check">Valider</button>
      <button class="btn" id="reveal">Voir les réponses</button>
      <button class="btn" id="regen">Nouveau tableau</button>
      <span class="result" id="result"></span>
    </div>
  </section>

</div>

<script>
// Affiche toute erreur de script en bas de page (utile hors de la plateforme Claude)
window.addEventListener("error",function(e){var d=document.getElementById("jserr");if(!d){d=document.createElement("div");d.id="jserr";d.style.cssText="position:fixed;left:0;right:0;bottom:0;background:#b4423b;color:#fff;padding:10px 16px;font:14px system-ui,sans-serif;z-index:99";document.body.appendChild(d);}d.textContent="Erreur de script : "+(e.message||e.type);});
</script>

// Lecture audio via la synthèse vocale du navigateur (voix anglaise)
function speak(word){
  if(!("speechSynthesis" in window))return;
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(word.replace(/\s*\/\s*/g,", "));
    const voices=speechSynthesis.getVoices();
    const v=voices.find(v=>/^en[-_]GB/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
    if(v)u.voice=v;
    u.lang=v?v.lang:"en-GB";u.rate=0.85;
    speechSynthesis.speak(u);
  }catch(e){}
}
if("speechSynthesis" in window){speechSynthesis.getVoices();speechSynthesis.addEventListener&&speechSynthesis.addEventListener("voiceschanged",()=>speechSynthesis.getVoices());}
function sayBtn(word){
  const b=document.createElement("button");b.type="button";b.className="say";
  b.textContent="🔊";b.title="Écouter « "+word+" »";b.setAttribute("aria-label","Écouter "+word);
  b.addEventListener("click",e=>{e.stopPropagation();speak(word);});
  return b;
}

function norm(s){return s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").replace(/\s*,\s*/g,", ");}
function accept(expected,val){
  // pour la traduction, on accepte l'une des alternatives ("tirer" pour "tirer, filmer") et sans "(se)"
  const e=norm(expected).replace(/’/g,"'"),v=norm(val).replace(/’/g,"'");
  if(v===e)return true;
  const strip=s=>s.replace(/\((se|s')\)\s*/g,"");
  if(v.replace(/\s*\/\s*/g,"/")===e.replace(/\s*\/\s*/g,"/"))return true;
  // les espaces en trop (ou manquants) ne comptent pas : on compare sans aucun espace
  const sq=x=>x.replace(/\s+/g,"");
  if(sq(v)===sq(e)||sq(v)===sq(strip(e))||sq(v)===sq(e.replace(/[()]/g,"")))return true;
  const alts=strip(e).split(/, | \/ /).map(sq);
  const okOne=x=>alts.includes(x)||alts.some(a=>x==="se"+a||x==="s'"+a);
  if(okOne(sq(v)))return true;
  const parts=v.split(/,|\/|;|\bou\b/).map(sq).filter(Boolean);
  return parts.length>1&&parts.every(okOne);
}

function generate(){
  const avail=activeVerbs();
  if(!avail.length){updateSelCount();$("seldetails").open=true;return;}
  const n=Math.min(avail.length,Math.max(1,parseInt($("n").value)||10));$("n").value=n;
  const pool=[...avail].sort(()=>Math.random()-.5).slice(0,n);
  const tb=$("grid").querySelector("tbody");tb.innerHTML="";rows=[];
  $("result").textContent="";$("result").className="result";
  // Colonne donnée : jamais la même que la dernière fois pour ce verbe, et répartition équilibrée sur le tableau
  let lastGiven={};
  try{lastGiven=JSON.parse(localStorage.getItem("vi-lastgiven")||"{}")||{};}catch(e){}
  const colCount=[0,0,0,0];
  pool.forEach((verb,r)=>{
    const allowed=[...givenCols];
    let cands=allowed.filter(c=>c!==lastGiven[verb.key]);if(!cands.length)cands=allowed;
    const min=Math.min(...cands.map(c=>colCount[c]));
    cands=cands.filter(c=>colCount[c]===min);
    const given=cands[Math.floor(Math.random()*cands.length)];
    colCount[given]++;lastGiven[verb.key]=given;
    const tr=document.createElement("tr");
    const num=document.createElement("td");num.className="num";num.textContent=r+1;tr.appendChild(num);
    const inputs=[];
    for(let c=0;c<4;c++){
      const td=document.createElement("td");td.dataset.label=COLS[c];
      if(c===given){
        td.className="given";td.textContent=verb.cells[c];
        if(verb.ipa[c]){const i=document.createElement("i");const sp=document.createElement("span");sp.className="ipa-txt";sp.textContent=verb.ipa[c];i.appendChild(sp);i.appendChild(sayBtn(verb.cells[c]));td.appendChild(i);}
        inputs.push(null);
      }else{
        const inp=document.createElement("input");inp.type="text";inp.id=`r${r}c${c}`;
        inp.autocapitalize="off";inp.spellcheck=false;inp.autocomplete="off";inp.enterKeyHint="next";inp.setAttribute("aria-label",`Ligne ${r+1}, colonne ${c+1}`);
        const corr=document.createElement("div");corr.className="corr";
        td.appendChild(inp);td.appendChild(corr);inputs.push(inp);
      }
      tr.appendChild(td);
    }
    tb.appendChild(tr);rows.push({verb,given,inputs});
  });
  try{localStorage.setItem("vi-lastgiven",JSON.stringify(lastGiven));}catch(e){}
  $("exoinfo").textContent=`${n} ligne${n>1?"s":""} · ${[...new Set(pool.map(v=>v.cat))].join(", ")}`;
  showPage("exo");
  const all=document.querySelectorAll("#grid input");if(all.length)all[all.length-1].enterKeyHint="done";
  const touch=window.matchMedia&&matchMedia("(pointer:coarse)").matches;
  if(all.length&&!touch)all[0].focus();
}

function check(reveal){
  let good=0,total=0;
  rows.forEach(row=>row.inputs.forEach((inp,c)=>{
    if(!inp)return;total++;
    const exp=row.verb.cells[c];
    const corr=inp.nextElementSibling;
    const showIpa=(wrong)=>{corr.innerHTML="";
      if(wrong){const w=document.createElement("div");w.className="wrong";w.textContent="Ta réponse : "+wrong;corr.appendChild(w);}
      if(row.verb.ipa[c]){const i=document.createElement("i");i.className="ipa-after";const sp=document.createElement("span");sp.className="ipa-txt";sp.textContent=row.verb.ipa[c];i.appendChild(sp);i.appendChild(sayBtn(exp));corr.appendChild(i);}};
    if(inp.disabled){inp.className="bad";showIpa(inp.dataset.wrong);return;} // réponse déjà révélée : comptée fausse
    const ok=accept(exp,inp.value);
    if(ok){good++;inp.className="ok";showIpa();}
    else{inp.className="bad";corr.textContent="";}
    if(reveal&&!ok){const wrong=inp.value.trim();inp.dataset.wrong=wrong;inp.value=exp;inp.className="bad";inp.disabled=true;showIpa(wrong);}
  }));
  const r=$("result");
  r.textContent=total?`${good} / ${total} ${total>1?"bonnes réponses":"bonne réponse"}`:"";
  r.className="result "+(good===total?"ok":"bad");
}
